<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birthday Surprise ♡</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#ffe1ef,#e8ddff,#e0f7ff);color:#684875;font-family:Georgia,serif}
#app{min-height:100vh;display:grid;place-items:center;padding:18px}
.page{width:100%;max-width:520px;text-align:center;background:#ffffffdf;padding:26px 20px;border-radius:28px;box-shadow:0 12px 40px #a888b533}
h1{color:#b36ca9;font-size:clamp(27px,7vw,38px)}
p{line-height:1.7}
.small{font-size:14px}
button{border:0;border-radius:30px;padding:13px 22px;margin:10px 4px;background:linear-gradient(100deg,#ffc3df,#c8b6ff);color:#62436e;font-size:16px;font-weight:bold}
input{width:100%;padding:14px;border:1px solid #d9b8e2;border-radius:12px;font-size:16px}
.cat{font-size:65px}
.switch{margin:25px auto;width:100px;height:55px;border-radius:40px;background:#c9b9df;padding:5px;text-align:left}
.knob{width:45px;height:45px;border-radius:50%;background:white;display:grid;place-items:center;font-size:24px}
.on{background:#f6a4d0}
.on .knob{margin-left:45px}
.count{font-size:90px;color:#d66ca8}
.cake{font-size:100px;touch-action:pan-y;user-select:none}
.photo{width:100%;height:260px;object-fit:cover;border-radius:18px;background:#f5e5fa}
.gallery{display:flex;overflow-x:auto;gap:12px;margin:20px 0}
.gallery img{width:85%;flex-shrink:0;height:280px;object-fit:cover;border-radius:18px;background:#f1e1fa}
.letter{text-align:left;white-space:pre-line;line-height:1.95}
.seal{font-size:70px;background:transparent}
.confetti{position:fixed;top:-30px;z-index:10;pointer-events:none;animation:fall 4s linear forwards;font-size:22px}
@keyframes fall{to{transform:translateY(110vh) rotate(650deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById('app');

function show(html){
app.innerHTML='<section class="page">'+html+'</section>';
window.scrollTo(0,0);
}

function btn(text,fn){
let b=document.createElement('button');
b.textContent=text;
b.onclick=fn;
return b;
}

function rain(){
let a=['🎉','💗','✨','🎂','🌸','HAPPY BIRTHDAY'];
for(let i=0;i<60;i++){
let e=document.createElement('div');
e.className='confetti';
e.textContent=a[Math.floor(Math.random()*a.length)];
e.style.left=Math.random()*100+'vw';
e.style.animationDuration=2+Math.random()*3+'s';
document.body.appendChild(e);
setTimeout(()=>e.remove(),5500);
}
}

show('<div class="cat">🔐</div><h1>Password, please</h1><p class="small">A little surprise is waiting just for you ♡</p><input id="pw" type="password" placeholder="Enter your password"><p id="err"></p><button id="unlock">Unlock ♡</button>');

document.getElementById('unlock').onclick=()=>{
if(document.getElementById('pw').value.trim().toLowerCase()==="it's my birthday"){
switchPage();
}else{
document.getElementById('err').textContent='Try again, babe ♡';
}
};

function switchPage(){
show('<h1>A little magic ✨</h1><p>Turn on the birthday lights</p><div class="switch" id="sw"><div class="knob">♡</div></div><p class="small">Tap the switch to begin</p>');
document.getElementById('sw').onclick=()=>{
document.getElementById('sw').classList.add('on');
setTimeout(countdown,400);
};
}

function countdown(){
let n=3;
show('<p>Get ready, birthday boy...</p><div class="count" id="num">3</div>');
let t=setInterval(()=>{
n--;
if(n>=0){
document.getElementById('num').textContent=n;
}else{
clearInterval(t);
loading();
}
},850);
}

function loading(){
show('<div class="cat">🎀</div><h1>Loading your birthday surprise...</h1><p>Collecting hugs, wishes & sparkles ♡</p><p>🌸 💗 ✨ 🌷</p>');
setTimeout(intro,1800);
}

function intro(){
show('<div class="cat">🐱🎂</div><h1>My Man was born 24 years ago today.</h1><p class="small">Yes babe, it’s you. A little surprise awaits....</p><button id="start">Start the surprise ♡</button>');
document.getElementById('start').onclick=cakePage;
}

function cakePage(){
show('<h1>Swipe to cut the cake</h1><p class="small">Drag your finger inside cake to slice</p><div class="cake" id="cake">🎂</div><p id="hint" class="small">Tap or swipe across the cake ♡</p><div id="next"></div>');
let done=false,x=0;
let c=document.getElementById('cake');

function cut(){
if(done)return;
done=true;
c.style.transform='rotate(-10deg) scale(1.1)';
document.getElementById('hint').textContent='Happy Birthday! 🎉';
rain();
document.getElementById('next').append(btn('Next →',birthdayPage));
}

c.onclick=cut;
c.ontouchstart=e=>x=e.touches[0].clientX;
c.ontouchend=e=>{
if(Math.abs(e.changedTouches[0].clientX-x)>10)cut();
};
}

function birthdayPage(){
show('<h1>Happy birthday my “mitha dill” 🤍</h1><img class="photo" src="pic1.jpeg" alt="His picture"><p class="small">You make this day special ♡</p><button id="next">Next →</button>');
document.getElementById('next').onclick=memories;
}

function memories(){
show('<h1>Our Memories 🥹💗</h1><p class="small">Swipe through some beautiful moments</p><div class="gallery">'+Array.from({length:8},(_,i)=>'<img src="memory'+(i+1)+'.jpeg" alt="Memory '+(i+1)+'">').join('')+'</div><button id="read">Read letter 💌</button>');
document.getElementById('read').onclick=letterIntro;
}

function letterIntro(){
show('<h1>A letter for you 💌</h1><p class="small">Tap the wax seal to open your special message</p><button class="seal" id="seal">💌</button>');
document.getElementById('seal').onclick=letterPage;
}

function letterPage(){
const letter=`শুভ জন্মদিন আমার সবচেয়ে প্রিয় মানুষ। 🤍🎂

আমাদের পরিচয়ের পর এটাই আপনার সাথে আমার প্রথম জন্মদিন। অনলাইনে আপনার সাথে পরিচয় হয়েছিল। তখন তো জানতাম না, একজন মানুষকে কখনো সামনে থেকে না দেখেও এতটা আপন মনে হতে পারে। জানতাম না, একটা অনলাইন পরিচয় একদিন আমার মনের এতটা জায়গা জুড়ে বসবে। 🥹

আজ আমাদের পরিচয়ের পর এতটা সময় পেরিয়ে গেছে। এই সময়ের মধ্যে আপনার সাথে আমার দেখা হয়নি, পাশাপাশি হাঁটা হয়নি, আপনার চোখের দিকে তাকিয়ে কথা বলা হয়নি। তবুও অদ্ভুতভাবে আপনি আমার খুব চেনা একজন মানুষ হয়ে গেছেন। আমার অনেক ভাবনার মাঝে, অনেক ভালো লাগার মুহূর্তে, কখনো কখনো অকারণ মন খারাপের সময়েও আপনি কোথাও না কোথাও জড়িয়ে থাকেন। 🌸

আপনাকে আমি ঠিক কীভাবে অনুভব করি, সেটা হয়তো শব্দ দিয়ে কখনো পুরোপুরি বোঝাতে পারব না। কিছু অনুভূতি থাকে, যেগুলো বলা যায় না, শুধু খুব যত্ন করে মনের মধ্যে রেখে দিতে হয়। আপনি আমার কাছে ঠিক তেমনই একজন। 🖤

আপনার জন্মদিনে তাই খুব বেশি কিছু চাইব না। শুধু চাই, জীবন আপনার প্রতি একটু কোমল হোক। আপনার মুখের হাসিটা যেন কোনোদিন মলিন না হয়। 😊 আপনার সব অপূর্ণ ইচ্ছে একদিন পূর্ণতা পাক। আপনি যেসব স্বপ্ন কাউকে না বলে নিজের মধ্যে লুকিয়ে রাখেন, সেগুলোরও যেন একদিন সুন্দর একটা ঠিকানা হয়। ✨

আর নিজের জন্য একটা ছোট্ট চাওয়া আছে। জীবন যত দূরেই নিয়ে যাক, আপনি যেন কোনো এক কোণে আমাকে মনে রাখেন। 🫶🏻

হয়তো আমাদের গল্পের ভবিষ্যৎ আমি জানি না, আমাদের দেখা হবে কি না সেটাও জানি না। কিন্তু একটা ব্যাপার জানি, আপনাকে চেনা আমার জীবনের খুব সুন্দর একটা অনুভূতি হয়ে থাকবে। 🤍

আপনি জানেন কি, কিছু মানুষকে ভালো লাগার জন্য তাদের পাশে থাকা লাগে না। শুধু তাদের অস্তিত্বটাই যথেষ্ট। আপনি আমার কাছে ঠিক তেমন। 🌙

শুভ জন্মদিন, আমার প্রিয় মানুষ। 🖤🎂
আপনি ভালো থাকুন। খুব ভালো থাকুন। 🌷 আর যদি কোনোদিন মনে হয়, পৃথিবীর কোথাও একজন মানুষ নিঃশব্দে আপনার ভালো থাকা চেয়েছিল, তাহলে মনে করবেন, সে আমি। 🤍

আপনার প্রিয়তমা 🫶🏻`;

show('<h1>A letter for you 🤍</h1><div class="letter" id="letter"></div><button id="close">Close ♡</button>');
document.getElementById('letter').textContent=letter;
document.getElementById('close').onclick=finalPage;
}

function finalPage(){
show('<div class="cat">🐱🎂</div><h1>Happy Birthday, my love! 💗</h1><p>May your days be gentle, bright and full of beautiful things.</p><p style="font-size:2rem">🎉 💖 🎉</p><button id="again">Close & return to start ↻</button>');
rain();
document.getElementById('again').onclick=()=>location.reload();
}
</script>
</body>
</html>
